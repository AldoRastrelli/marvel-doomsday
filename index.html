  .bar { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .35s ease; }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {

  .link { background: none; border: 0; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }

  ol.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .item {
    display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: center;

  .item label { display: contents; cursor: pointer; }
  .item input { width: 18px; height: 18px; margin: 0; accent-color: var(--check); cursor: pointer; }

  .tag.key { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }
  .item.upcoming { opacity: .7; }

  .empty { color: var(--muted); font-size: 13px; padding: 8px 10px; }

  @media (max-width: 480px) {

      ["nwh", { es: "Spider-Man: No Way Home", en: "Spider-Man: No Way Home" }, "film", "2021-12", { key: true }],
      ["moonknight", { es: "Moon Knight", en: "Moon Knight" }, "series", "2022-03"],
      ["mom", { es: "Doctor Strange en el Multiverso de la Locura", en: "Doctor Strange in the Multiverse of Madness" }, "film", "2022-05", { key: true }],
      ["msmarvel", { es: "Ms. Marvel", en: "Ms. Marvel" }, "series", "2022-06"],
      ["thor4", { es: "Thor: Love and Thunder", en: "Thor: Love and Thunder" }, "film", "2022-07"],
      ["groot1", { es: "I Am Groot, temporada 1", en: "I Am Groot, season 1" }, "shorts", "2022-08", { opt: true }],
      ["shehulk", { es: "She-Hulk: Abogada Hulka", en: "She-Hulk: Attorney at Law" }, "series", "2022-08"],
      ["werewolf", { es: "Werewolf by Night", en: "Werewolf by Night" }, "special", "2022-10"],
      ["bp2", { es: "Black Panther: Wakanda Forever", en: "Black Panther: Wakanda Forever" }, "film", "2022-11", { key: true }],
      ["holiday", { es: "The Guardians of the Galaxy Holiday Special", en: "The Guardians of the Galaxy Holiday Special" }, "special", "2022-11"],
    ]},
    { id: 5, items: [
      ["quantumania", { es: "Ant-Man and the Wasp: Quantumania", en: "Ant-Man and the Wasp: Quantumania" }, "film", "2023-02"],
      ["gotg3", { es: "Guardianes de la Galaxia Vol. 3", en: "Guardians of the Galaxy Vol. 3" }, "film", "2023-05"],
      ["secretinvasion", { es: "Secret Invasion", en: "Secret Invasion" }, "series", "2023-06"],
      ["groot2", { es: "I Am Groot, temporada 2", en: "I Am Groot, season 2" }, "shorts", "2023-09", { opt: true }],
      ["loki2", { es: "Loki, temporada 2", en: "Loki, season 2" }, "series", "2023-10", { key: true }],
      ["marvels", { es: "The Marvels", en: "The Marvels" }, "film", "2023-11"],
      ["whatif2", { es: "What If...?, temporada 2", en: "What If...?, season 2" }, "animated", "2023-12"],
      ["echo", { es: "Echo", en: "Echo" }, "series", "2024-01"],
      ["xmen97a", { es: "X-Men '97, temporada 1", en: "X-Men '97, season 1" }, "animated", "2024-03", { opt: true }],
      ["dpw", { es: "Deadpool & Wolverine", en: "Deadpool & Wolverine" }, "film", "2024-07", { key: true }],
      ["agatha", { es: "Agatha All Along", en: "Agatha All Along" }, "series", "2024-09"],
      ["whatif3", { es: "What If...?, temporada 3", en: "What If...?, season 3" }, "animated", "2024-12"],
      ["yfnsm1", { es: "Your Friendly Neighborhood Spider-Man, temporada 1", en: "Your Friendly Neighborhood Spider-Man, season 1" }, "animated", "2025-01", { opt: true }],
      ["cap4", { es: "Capitán América: Un Nuevo Mundo", en: "Captain America: Brave New World" }, "film", "2025-02", { key: true }],
      ["ddba1", { es: "Daredevil: Born Again, temporada 1", en: "Daredevil: Born Again, season 1" }, "series", "2025-03"],
      ["thunderbolts", { es: "Thunderbolts*", en: "Thunderbolts*" }, "film", "2025-05", { key: true }],
      ["ironheart", { es: "Ironheart", en: "Ironheart" }, "series", "2025-06"],
    ]},
    { id: 6, items: [
      ["ff", { es: "Los 4 Fantásticos: Primeros Pasos", en: "The Fantastic Four: First Steps" }, "film", "2025-07", { key: true }],
      ["eyes", { es: "Eyes of Wakanda", en: "Eyes of Wakanda" }, "animated", "2025-08"],
      ["zombies", { es: "Marvel Zombies", en: "Marvel Zombies" }, "animated", "2025-09"],
      ["wonderman", { es: "Wonder Man", en: "Wonder Man" }, "series", "2026-01"],
      ["ddba2", { es: "Daredevil: Born Again, temporada 2", en: "Daredevil: Born Again, season 2" }, "series", "2026-03"],
      ["punisher", { es: "The Punisher: One Last Kill", en: "The Punisher: One Last Kill" }, "special", "2026-05"],
      ["xmen97b", { es: "X-Men '97, temporada 2", en: "X-Men '97, season 2" }, "animated", "2026-07", { opt: true }],
      ["bnd", { es: "Spider-Man: Brand New Day", en: "Spider-Man: Brand New Day" }, "film", "2026-07", { key: true }],
      ["encore", { es: "Avengers Endgame: Encore", en: "Avengers Endgame: Encore" }, "rerelease", "2026-09", { opt: true }],
      ["visionquest", { es: "VisionQuest", en: "VisionQuest" }, "series", "2026-10-14", { upcoming: true }],
      ["doomsday", { es: "Avengers: Doomsday", en: "Avengers: Doomsday" }, "film", "2026-12-18", { upcoming: true, final: true }],
    ]},
  ];

  const state = load();
  let t = T[state.lang];

  function detectLang() {
    try { return (navigator.language || "").toLowerCase().startsWith("es") ? "es" : "en"; } catch { return "es"; }
  }
  function load() {
    const base = { seen: {}, countOptional: false, filter: "all", lang: detectLang() };
    try {
      const raw = localStorage.getItem(STORE);
      const saved = raw ? { ...base, ...JSON.parse(raw) } : base;
      if (!T[saved.lang]) saved.lang = base.lang;
      return saved;
    } catch { return base; }
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch {}
  }

  const allItems = PHASES.flatMap(p => p.items.map(([id, title, kind, date, flags = {}]) => ({ id, title, kind, date, ...flags })));
  const phaseItems = (phase) => phase.items.map(([id]) => allItems.find(i => i.id === id));
  const phaseName = (phase) => phase.id === "tv" ? t.tvName : t.phase(phase.id);
  const inScope = (i) => state.filter === "key" ? !!i.key : true;
  const counts = (items) => {
    const eligible = items.filter(i => inScope(i) && !i.upcoming && (state.countOptional || !i.opt));
    const seen = eligible.filter(i => state.seen[i.id]);
    return { total: eligible.length, seen: seen.length };
  };

  function fmtDate(d) {
    if (d.includes("..")) { const [a, b] = d.split(".."); return t.fmtRange(a, b); }
    const [y, m, day] = d.split("-");
    const month = t.months[Number(m) - 1];
    return day ? t.fmtDay(Number(day), month, y) : t.fmtMonth(month, y);
  }
  const pluralDays = (ms) => Math.ceil(ms / 86400000);

  function applyStatic() {
    document.documentElement.lang = state.lang;
    document.title = t.docTitle;
    document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
    document.getElementById("shareText").setAttribute("aria-label", t.shareTextLabel);
    document.getElementById("shareImg").alt = t.shareImgAlt;
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
    restoreReset();
  }

  function renderSummary() {
    const { total, seen } = counts(allItems);
    const pct = total ? Math.round((seen / total) * 100) : 0;
    document.getElementById("pct").innerHTML = `${pct}<small>%</small>`;
    document.getElementById("headline").textContent = t.headline(pct, state.filter === "key" ? t.scopeKey : t.scopeAll);
    const keyLeft = allItems.filter(i => i.key && !state.seen[i.id]).length;
    document.getElementById("counts").textContent = `${t.seenOf(seen, total, state.filter === "key")} · ${t.keyLeft(keyLeft)}`;
    const fill = document.getElementById("barfill");
    fill.style.width = pct + "%";
    fill.classList.toggle("done", pct === 100);
  }

  function renderCountdown() {
    const ms = DOOMSDAY - Date.now();
    const days = pluralDays(ms);
    const el = document.getElementById("countdown");
    el.innerHTML = days > 0 ? t.countdownIn(days) : days === 0 ? t.countdownToday : t.countdownOut;

    const clock = document.getElementById("clock");
    if (ms <= 0) { clock.hidden = true; return; }
    const pad = n => String(n).padStart(2, "0");
    const nums = [Math.floor(ms / 86400000), Math.floor(ms / 3600000) % 24, Math.floor(ms / 60000) % 60, Math.floor(ms / 1000) % 60];
    clock.innerHTML = nums.map((n, i) => `<div><span class="n">${pad(n)}</span><span class="u">${t.clockUnits[i]}</span></div>`).join("");
  }

  function visible(item) {
    if (state.filter === "pending") return !state.seen[item.id] && !item.upcoming;
    if (state.filter === "key") return item.key;
    return true;
  }

  function renderPhases() {
    const root = document.getElementById("phases");
    root.innerHTML = "";
    PHASES.forEach(phase => {
      const items = phaseItems(phase);
      const shown = items.filter(visible);
      if (!shown.length) return;
      const { total, seen } = counts(items);
      const note = phase.id === "tv" ? `<small>${t.tvNote}</small>` : "";
      const section = document.createElement("section");
      section.className = "phase";
      section.innerHTML = `
        <div class="phase-head">
          <h2 class="display">${phaseName(phase)}${note}</h2>
          <div class="phase-meta">
            <span class="mono">${seen}/${total}</span>
            <button class="link" data-phase="${phase.id}">${seen === total ? t.unmarkAll : t.markAll}</button>
          </div>
        </div>
        <ol class="items">
          ${shown.map(rowHtml).join("")}
        </ol>`;
      root.appendChild(section);
    });
    if (!root.children.length) {
      root.innerHTML = `<p class="empty">${t.empty}</p>`;
    }
  }

  function rowHtml(i) {
    const seen = !!state.seen[i.id];
    const tags = [
      i.key ? `<span class="tag key">${t.tagKey}</span>` : "",
      i.opt ? `<span class="tag">${t.tagOpt}</span>` : "",
    ].join("");
    const cls = ["item", seen ? "seen" : "", i.upcoming ? "upcoming" : ""].join(" ");
    const title = i.title[state.lang];
    const control = i.upcoming
      ? `<input type="checkbox" id="chk-${i.id}" disabled aria-label="${title}, ${t.notReleased}">`
      : `<input type="checkbox" id="chk-${i.id}" data-id="${i.id}" ${seen ? "checked" : ""}>`;
    const upcoming = i.upcoming ? ` <span class="meta">· ${t.upcoming}</span>` : "";
    return `
      <li class="${cls}">
        <label for="chk-${i.id}">
          ${control}
          <div>
            <div class="title">${title}${upcoming}</div>
            <div class="meta">${t.kinds[i.kind]} · ${fmtDate(i.date)}</div>
          </div>
        </label>
        <div class="tags">${tags}</div>
      </li>`;
  }

  function renderAll() { renderSummary(); renderPhases(); renderCountdown(); }

  document.getElementById("phases").addEventListener("change", e => {
    const id = e.target.dataset.id;
    if (!id) return;
    if (e.target.checked) state.seen[id] = true; else delete state.seen[id];
    save(); renderAll();
  });

  document.getElementById("phases").addEventListener("click", e => {
    const pid = e.target.dataset.phase;
    if (!pid) return;
    const phase = PHASES.find(p => String(p.id) === pid);
    const items = phaseItems(phase).filter(i => inScope(i) && !i.upcoming && (state.countOptional || !i.opt));
    const allSeen = items.every(i => state.seen[i.id]);
    items.forEach(i => { if (allSeen) delete state.seen[i.id]; else state.seen[i.id] = true; });
    save(); renderAll();
  });

  document.querySelectorAll(".chip").forEach(btn => {
    btn.setAttribute("aria-pressed", String(btn.dataset.filter === state.filter));
    btn.addEventListener("click", () => {
      state.filter = btn.dataset.filter;
      document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
      save(); renderAll();
    });
  });

  document.querySelectorAll(".lang button").forEach(btn => {
    btn.addEventListener("click", () => {
      state.lang = btn.dataset.lang;
      t = T[state.lang];
      save(); applyStatic(); renderAll();
      shareStatus.textContent = "";
      shareBox.hidden = true;
      document.getElementById("shareImg").hidden = true;
    });
  });

  const optToggle = document.getElementById("countOptional");
  optToggle.checked = state.countOptional;
  optToggle.addEventListener("change", () => { state.countOptional = optToggle.checked; save(); renderAll(); });

  const resetZone = document.getElementById("resetZone");
  resetZone.addEventListener("click", e => {
    if (e.target.id === "resetBtn") {
      resetZone.innerHTML = `<div class="confirm">${t.resetConfirm(Object.keys(state.seen).length)} <button class="link danger" id="resetYes">${t.resetYes}</button> <button class="link" id="resetNo">${t.resetNo}</button></div>`;
    } else if (e.target.id === "resetYes") {
      state.seen = {}; save(); renderAll(); restoreReset();
    } else if (e.target.id === "resetNo") {
      restoreReset();
    }
  });
  function restoreReset() { resetZone.innerHTML = `<button class="link danger" id="resetBtn">${t.reset}</button>`; }

  function shareText() {
    const { total, seen } = counts(allItems);
    const pct = total ? Math.round((seen / total) * 100) : 0;
    const filled = Math.round(pct / 10);
    const blocks = "🟩".repeat(filled) + "⬜".repeat(10 - filled);
    const keyLeft = allItems.filter(i => i.key && !state.seen[i.id]).length;
    const days = pluralDays(DOOMSDAY - Date.now());
    return [
      t.shareLine1(pct, state.filter === "key"),
      blocks,
      `${t.shareLine3(seen, total)} · ${t.keyLeft(keyLeft)}`,
      t.shareDays(days),
      SITE_URL,
    ].join("\n");
  }

  const shareStatus = document.getElementById("shareStatus");
  const shareBox = document.getElementById("shareText");
  function showFallback(text, msg) {
    shareBox.value = text;
    shareBox.hidden = false;
    shareBox.focus();
    shareBox.select();
    shareStatus.textContent = msg;
  }
  document.getElementById("shareBtn").addEventListener("click", async () => {
    const text = shareText();
    shareBox.hidden = true;
    if (navigator.share) {
      try { await navigator.share({ text }); shareStatus.textContent = t.shared; return; }
      catch (e) { if (e && e.name === "AbortError") { shareStatus.textContent = ""; return; } }
    }
    try {
      await navigator.clipboard.writeText(text);
      shareStatus.textContent = t.copied;
      shareBox.value = text;
      shareBox.hidden = false;
    } catch {
      showFallback(text, t.selectCopy);
    }
  });

  async function drawShareCard() {
    try { await document.fonts.ready; } catch {}
    const c = document.getElementById("shareCanvas");
    const ctx = c.getContext("2d");
    const W = c.width, H = c.height;
    const display = (w, px) => `${w} ${px}px "Big Shoulders Display", "Arial Narrow", Impact, sans-serif`;
    const sans = (w, px) => `${w} ${px}px "IBM Plex Sans", system-ui, sans-serif`;
    const BG = "#0e1411", INK = "#e6ebe4", MUTED = "#97a69b", LINE = "#2a3530", GREEN = "#3fa16d", GOLD = "#e0b341";

    const { total, seen } = counts(allItems);
    const pct = total ? Math.round((seen / total) * 100) : 0;
    const keyLeft = allItems.filter(i => i.key && !state.seen[i.id]).length;
    const scopeLabel = state.filter === "key" ? t.cardScopeKey : t.cardScopeAll;

    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = LINE; ctx.lineWidth = 2;
    ctx.strokeRect(40, 40, W - 80, H - 80);

    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = GOLD; ctx.font = display(700, 44); ctx.textAlign = "left";
    ctx.fillText(t.cardTitle, 90, 130);
    drawClock(ctx, W - 90, 130, { display, sans, INK, MUTED });

    ctx.fillStyle = GREEN; ctx.font = display(900, 360); ctx.textAlign = "center";
    ctx.fillText(`${pct}%`, W / 2, 500);
    ctx.fillStyle = INK; ctx.font = sans(500, 36);
    ctx.fillText(scopeLabel, W / 2, 560);

    const bx = 90, by = 610, bw = W - 180, bh = 22;
    roundRect(ctx, bx, by, bw, bh, 11, LINE);
    if (pct > 0) roundRect(ctx, bx, by, Math.max(bh, bw * pct / 100), bh, 11, pct === 100 ? GOLD : GREEN);

    ctx.fillStyle = MUTED; ctx.font = sans(400, 28); ctx.textAlign = "center";
    ctx.fillText(`${t.cardSeen(seen, total)} · ${t.keyLeft(keyLeft)}`, W / 2, 680);

    const rows = PHASES
      .map(p => ({ name: phaseName(p), ...counts(phaseItems(p)) }))
      .filter(r => r.total > 0);
    const rowH = Math.min(40, Math.floor(220 / rows.length));
    let y = 745;
    rows.forEach(r => {
      ctx.fillStyle = INK; ctx.font = display(700, 30); ctx.textAlign = "left";
      ctx.fillText(r.name.toUpperCase(), 90, y + 10);
      const rx = 400, rw = W - 90 - 110 - rx;
      roundRect(ctx, rx, y - 10, rw, 14, 7, LINE);
      if (r.seen > 0) roundRect(ctx, rx, y - 10, Math.max(14, rw * r.seen / r.total), 14, 7, r.seen === r.total ? GOLD : GREEN);
      ctx.fillStyle = MUTED; ctx.font = sans(500, 24); ctx.textAlign = "right";
      ctx.fillText(`${r.seen}/${r.total}`, W - 90, y + 6);
      y += rowH;
    });

    ctx.fillStyle = MUTED; ctx.font = sans(400, 24); ctx.textAlign = "center";
    ctx.fillText(t.cardDate, W / 2, H - 105);
    ctx.fillStyle = GOLD; ctx.font = sans(600, 28);
    ctx.fillText("aldanarastrelli.dev.ar/rumbo-a-doomsday", W / 2, H - 62);

    return c;
  }
  function drawClock(ctx, rightX, baseY, f) {
    const ms = DOOMSDAY - Date.now();
    if (ms <= 0) {
      ctx.fillStyle = f.MUTED; ctx.font = f.sans(500, 28); ctx.textAlign = "right";
      ctx.fillText(t.cardOut, rightX, baseY - 2);
      return;
    }
    const pad = n => String(n).padStart(2, "0");
    const nums = [Math.floor(ms / 86400000), Math.floor(ms / 3600000) % 24, Math.floor(ms / 60000) % 60, Math.floor(ms / 1000) % 60];
    const colW = 96;
    let x = rightX - colW * nums.length;
    ctx.textAlign = "center";
    nums.forEach((n, idx) => {
      const cx = x + colW / 2;
      ctx.fillStyle = f.INK; ctx.font = f.display(700, 52);
      ctx.fillText(pad(n), cx, baseY);
      ctx.fillStyle = f.MUTED; ctx.font = f.sans(500, 16);
      ctx.fillText(t.clockUnits[idx].toUpperCase(), cx, baseY + 24);
      if (idx < nums.length - 1) {
        ctx.fillStyle = f.MUTED; ctx.font = f.display(700, 40);
        ctx.fillText(":", x + colW, baseY - 4);
      }
      x += colW;
    });
  }
  function roundRect(ctx, x, y, w, h, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  }

  document.getElementById("shareImgBtn").addEventListener("click", async () => {
    shareBox.hidden = true;
    shareStatus.textContent = t.generating;
    const c = await drawShareCard();
    const blob = await new Promise(res => c.toBlob(res, "image/png"));
    const img = document.getElementById("shareImg");
    img.src = URL.createObjectURL(blob);
    img.hidden = false;
    const file = new File([blob], "rumbo-a-doomsday.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], text: shareText(), url: SITE_URL }); shareStatus.textContent = t.shared; return; }
      catch (e) { if (e && e.name === "AbortError") { shareStatus.textContent = ""; return; } }
    }
    shareStatus.textContent = t.saveHint;
  });

  applyStatic();
  renderAll();
  setInterval(renderCountdown, 1000);
</script>
</body>
